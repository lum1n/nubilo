# XcodeGen spec (https://github.com/yonaskolb/XcodeGen, 2.39+ for
# supportedDestinations). Generate the project with:
#
#   brew install xcodegen && cd apps/Nubilo && xcodegen
#
# Signing team: create the untracked project.local.yml next to this file
# before running xcodegen (it is required; see README):
#
#   settings: {base: {DEVELOPMENT_TEAM: ABCDE12345}}
#
# Use `settings: {}` to pick the team in Xcode instead.
name: Nubilo
include:
  - project.local.yml
options:
  bundleIdPrefix: dev.nubilo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  NubiloKit:
    path: Packages/NubiloKit
  NubiloUI:
    path: Packages/NubiloUI

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nubilo:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: NubiloKit
      - package: NubiloUI
      # Nubilo in the Files app (iPhone and iPad only).
      - target: NubiloFiles
        embed: true
        platformFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nubilo.app
        PRODUCT_NAME: Nubilo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Nubilo-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Nubilo-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Nubilo-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # The embed script below writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nubilo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Nubilo backs up your photos and videos to your own server.
        # Keychain group shared with the Files extension (SharedCredentials).
        NubiloKeychainGroup: $(AppIdentifierPrefix)dev.nubilo.shared
        # Mac: the calendar mirror reads the calendars you choose (read-only).
        NSCalendarsFullAccessUsageDescription: Nubilo copies the calendars you choose to your own server, so your other devices can show them.
        NSCameraUsageDescription: Nubilo uses the camera to scan the QR code of your invite.
        CFBundleURLTypes:
          - CFBundleURLName: dev.nubilo.setup
            CFBundleURLSchemes: [nubilo]
        BGTaskSchedulerPermittedIdentifiers:
          - dev.nubilo.photos.backup
        UIBackgroundModes: [processing, fetch]
        # Self-signed LAN servers are reached over HTTPS with a pinned
        # certificate (TLSPinning.swift), so no ATS exceptions are needed.
    postBuildScripts:
      - name: Embed nubilo CLI (macOS)
        basedOnDependencyAnalysis: false
        script: |
          # The Mac app drives the server through the Go CLI. Build it first:
          #   scripts/build-wired.sh                      (relay support, writes bin/nubilo)
          #   go build -o bin/nubilo ./cmd/nubilo         (without relay support)
          # or point NUBILO_CLI_SOURCE at a binary. Missing binary = warning only.
          set -euo pipefail
          [ "${PLATFORM_NAME}" = "macosx" ] || exit 0
          SRC="${NUBILO_CLI_SOURCE:-${SRCROOT}/../../bin/nubilo}"
          if [ ! -x "${SRC}" ]; then
            echo "warning: ${SRC} not found; the menu bar server controls will be disabled. Run scripts/build-wired.sh."
            exit 0
          fi
          # Contents/Helpers, not Contents/MacOS: "nubilo" and the app's own
          # "Nubilo" executable collide on case-insensitive APFS.
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          mkdir -p "${DEST}"
          cp -f "${SRC}" "${DEST}/nubilo"
          chmod 755 "${DEST}/nubilo"
          # Nested code must be signed before Xcode signs the bundle.
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          TIMESTAMP="--timestamp"
          [ "${IDENTITY}" = "-" ] && TIMESTAMP="--timestamp=none"
          # No entitlements: the CLI runs the server and folder sync only;
          # Photos and Calendar access belong to the app.
          codesign --force --options runtime "${TIMESTAMP}" \
            --sign "${IDENTITY}" "${DEST}/nubilo"

  NubiloFiles:
    type: app-extension
    platform: iOS
    sources:
      - path: FilesExtension
        excludes:
          - "*.entitlements"
          - Info.plist
    dependencies:
      - package: NubiloKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nubilo.app.files
        PRODUCT_NAME: NubiloFiles
        CODE_SIGN_ENTITLEMENTS: FilesExtension/NubiloFiles.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: FilesExtension/Info.plist
      properties:
        CFBundleDisplayName: Nubilo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NubiloKeychainGroup: $(AppIdentifierPrefix)dev.nubilo.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: group.dev.nubilo.shared

schemes:
  Nubilo:
    build:
      targets:
        Nubilo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # NubiloKit's XCTest target (signer vectors from Go, client, live server).
        - package: NubiloKit/NubiloKitTests
